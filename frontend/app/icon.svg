<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neumorphic Drop Shadow Filter -->
    <filter id="neuShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#A3B1C6" flood-opacity="0.8"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <!-- Core Pill Gradient & Shadow -->
    <linearGradient id="coreViolet" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B73FF"/>
      <stop offset="1" stop-color="#5B52EE"/>
    </linearGradient>

    <filter id="coreGlow" x="8" y="8" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5B52EE" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Soft-Clay Neumorphic Base -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#E0E5EC" filter="url(#neuShadow)"/>

  <!-- Inner Soft Violet Emblem Pod -->
  <rect x="15" y="15" width="34" height="34" rx="11" fill="url(#coreViolet)" filter="url(#coreGlow)"/>

  <!-- Crisp Geometric "S" Symbol -->
  <path d="M37.5 24.5C36.2 23.2 34.4 22.5 32 22.5C28.2 22.5 25.8 24.4 25.8 27.5C25.8 30.2 27.8 31.8 31.2 32.6L33.4 33.1C35.8 33.7 37 34.8 37 36.5C37 38.6 24.8 38.9 29.5 41.5C30.8 41.8 32.2 41.9 33.5 41.6C34.8 41.3 36.2 40.5 37.2 39.4L35.8 38C34.2 39.8 31.5 40 29.5 39.2C27.5 38.4 26.5 36.6 26.5 36.5C26.5 34.2 28.2 33 30.6 32.4L32.8 31.9C35.6 31.2 36.5 30 36.5 27.8C36.5 26.3 35.8 25.2 34.5 24.5" fill="none"/>
  
  <!-- Solid Bold S Mark for high contrast at 16px/32px/64px -->
  <text x="32" y="40" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="-0.5">S</text>
</svg>
