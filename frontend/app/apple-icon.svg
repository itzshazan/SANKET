<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neumorphic Drop Shadow Filter -->
    <filter id="appleShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="8" dy="8" stdDeviation="8" flood-color="#A3B1C6" flood-opacity="0.8"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <linearGradient id="appleViolet" x1="45" y1="45" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B73FF"/>
      <stop offset="1" stop-color="#5B52EE"/>
    </linearGradient>

    <filter id="appleGlow" x="20" y="20" width="140" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5B52EE" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="180" height="180" rx="40" fill="#E0E5EC"/>

  <!-- Outer Soft-Clay Neumorphic Pod -->
  <rect x="20" y="20" width="140" height="140" rx="34" fill="#E0E5EC" filter="url(#appleShadow)"/>

  <!-- Inner Soft Violet Emblem Pod -->
  <rect x="45" y="45" width="90" height="90" rx="26" fill="url(#appleViolet)" filter="url(#appleGlow)"/>

  <!-- Solid Bold S Mark -->
  <text x="90" y="112" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" text-anchor="middle" letter-spacing="-1">S</text>
</svg>
